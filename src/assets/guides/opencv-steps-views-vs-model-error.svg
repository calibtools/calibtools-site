<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="0 0 640 290" font-family="Geist, system-ui, sans-serif" role="img"><rect width="640" height="290" fill="#fff"/><text x="20" y="24" font-size="15.5" font-weight="600" fill="#141414">How the 20 views were taken</text><text x="286" y="24" font-size="15.5" font-weight="600" fill="#141414">Largest error of the lens model</text><line x1="326.6" y1="38" x2="326.6" y2="250" stroke="#A8A59C" stroke-width="1" stroke-dasharray="3 3"/><text x="326.6" y="268" text-anchor="middle" font-size="12.5" fill="#4A4A47" font-family="'Geist Mono', ui-monospace, monospace">0.1 px</text><line x1="461.6" y1="38" x2="461.6" y2="250" stroke="#A8A59C" stroke-width="1" stroke-dasharray="3 3"/><text x="461.6" y="268" text-anchor="middle" font-size="12.5" fill="#4A4A47" font-family="'Geist Mono', ui-monospace, monospace">1 px</text><text x="20" y="65" font-size="14" fill="#141414">Across the frame, tilted 15 to 25°</text><rect x="286" y="50" width="51" height="20" fill="#141414"/><rect x="341" y="50" width="72" height="20" fill="#fff"/><text x="345" y="65" font-size="14.5" font-weight="400" fill="#141414" font-family="'Geist Mono', ui-monospace, monospace">0.12 px</text><text x="20" y="99" font-size="14" fill="#141414">Across the frame, tilted 5 to 45°</text><rect x="286" y="84" width="72.2" height="20" fill="#141414"/><rect x="362.2" y="84" width="72" height="20" fill="#fff"/><text x="366.2" y="99" font-size="14.5" font-weight="400" fill="#141414" font-family="'Geist Mono', ui-monospace, monospace">0.17 px</text><text x="20" y="133" font-size="14" fill="#141414">Same, all at one distance</text><rect x="286" y="118" width="66.8" height="20" fill="#141414"/><rect x="356.8" y="118" width="72" height="20" fill="#fff"/><text x="360.8" y="133" font-size="14.5" font-weight="400" fill="#141414" font-family="'Geist Mono', ui-monospace, monospace">0.16 px</text><text x="20" y="167" font-size="14" fill="#141414">Tilted 40 to 60°</text><rect x="286" y="152" width="141.2" height="20" fill="#E60012"/><rect x="431.2" y="152" width="72" height="20" fill="#fff"/><text x="435.2" y="167" font-size="14.5" font-weight="600" fill="#B3000E" font-family="'Geist Mono', ui-monospace, monospace">0.56 px</text><text x="20" y="201" font-size="14" fill="#141414">Tilted under 5°</text><rect x="286" y="186" width="181.1" height="20" fill="#E60012"/><rect x="471.1" y="186" width="72" height="20" fill="#fff"/><text x="475.1" y="201" font-size="14.5" font-weight="600" fill="#B3000E" font-family="'Geist Mono', ui-monospace, monospace">1.10 px</text><text x="20" y="235" font-size="14" fill="#141414">Always in the middle of the frame</text><rect x="286" y="220" width="237.1" height="20" fill="#E60012"/><rect x="527.1" y="220" width="72" height="20" fill="#fff"/><text x="531.1" y="235" font-size="14.5" font-weight="600" fill="#B3000E" font-family="'Geist Mono', ui-monospace, monospace">2.85 px</text></svg>
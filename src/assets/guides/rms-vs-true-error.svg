<svg xmlns="http://www.w3.org/2000/svg" width="640" height="494" viewBox="0 0 640 494" font-family="Geist, system-ui, sans-serif" role="img"><rect width="640" height="494" fill="#fff"/><text x="20" y="26" font-size="16" font-weight="600" fill="#141414">Reprojection error</text><text x="20" y="48" font-size="14" fill="#141414">RMS in px, what you see</text><text x="336" y="26" font-size="16" font-weight="600" fill="#141414">Largest error of the lens model</text><text x="336" y="48" font-size="14" fill="#141414">px, logarithmic scale, what you get</text><line x1="20" y1="70" x2="620" y2="70" stroke="#141414" stroke-width="1"/><text x="20" y="91" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#4A4A47">GOOD SET</text><text x="20" y="112" font-size="15" fill="#141414">20 views across the frame, tilted</text><rect x="20" y="120" width="21.3" height="16" fill="#141414"/><text x="47.3" y="133" font-size="14" fill="#141414" font-family="'Geist Mono', ui-monospace, monospace">0.023</text><rect x="336" y="120" width="21.6" height="16" fill="#E60012"/><text x="363.6" y="133" font-size="14" fill="#141414" font-family="'Geist Mono', ui-monospace, monospace">0.17</text><line x1="20" y1="158" x2="620" y2="158" stroke="#141414" stroke-width="1"/><text x="20" y="179" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#4A4A47">RMS NO HIGHER THAN THE GOOD SET</text><text x="20" y="200" font-size="15" fill="#141414">Board always in the middle</text><rect x="20" y="208" width="18.6" height="16" fill="#141414"/><text x="44.6" y="221" font-size="14" fill="#141414" font-family="'Geist Mono', ui-monospace, monospace">0.020</text><rect x="336" y="208" width="147.1" height="16" fill="#E60012"/><text x="489.1" y="221" font-size="14" fill="#141414" font-family="'Geist Mono', ui-monospace, monospace">3.72</text><text x="20" y="254" font-size="15" fill="#141414">Board never tilted</text><rect x="20" y="262" width="17.6" height="16" fill="#141414"/><text x="43.6" y="275" font-size="14" fill="#141414" font-family="'Geist Mono', ui-monospace, monospace">0.019</text><rect x="336" y="262" width="85.1" height="16" fill="#E60012"/><text x="427.1" y="275" font-size="14" fill="#141414" font-family="'Geist Mono', ui-monospace, monospace">0.81</text><line x1="20" y1="300" x2="620" y2="300" stroke="#141414" stroke-width="1"/><text x="20" y="321" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#4A4A47">RMS HIGHER, STILL SMALL</text><text x="20" y="342" font-size="15" fill="#141414">One view sheared by 5 px</text><rect x="20" y="350" width="74.2" height="16" fill="#141414"/><text x="100.2" y="363" font-size="14" fill="#141414" font-family="'Geist Mono', ui-monospace, monospace">0.080</text><rect x="336" y="350" width="111.2" height="16" fill="#E60012"/><text x="453.2" y="363" font-size="14" fill="#141414" font-family="'Geist Mono', ui-monospace, monospace">1.54</text><text x="20" y="396" font-size="15" fill="#141414">Print stretched by 0.3 %</text><rect x="20" y="404" width="47.3" height="16" fill="#141414"/><text x="73.3" y="417" font-size="14" fill="#141414" font-family="'Geist Mono', ui-monospace, monospace">0.051</text><rect x="336" y="404" width="127.5" height="16" fill="#E60012"/><text x="469.5" y="417" font-size="14" fill="#141414" font-family="'Geist Mono', ui-monospace, monospace">2.30</text><text x="20" y="450" font-size="15" fill="#141414">Board bowed by 1 mm</text><rect x="20" y="458" width="203.2" height="16" fill="#141414"/><text x="229.2" y="471" font-size="14" fill="#141414" font-family="'Geist Mono', ui-monospace, monospace">0.219</text><rect x="336" y="458" width="213.6" height="16" fill="#E60012"/><text x="555.6" y="471" font-size="14" fill="#141414" font-family="'Geist Mono', ui-monospace, monospace">19.1</text></svg>
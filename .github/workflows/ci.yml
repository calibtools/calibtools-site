name: CI
# One run per change: pull requests, and pushes to main (not both for the same commit).
# Jobs run in parallel where they can: unit tests beside the build, and the checks that need the
# built site beside each other. The job named "build" is the gate scripts/ship.mjs waits for: it
# passes only when every blocking job passed.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { python: 'true' }
      - run: pnpm test
        env:
          BLOCKED_NAMES: ${{ secrets.BLOCKED_NAMES }}
      - run: pnpm check

  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { python: 'true' }
      - run: pnpm build
        env:
          SKIP_STOREFRONT_CHECK: '1'
          SKIP_SPECS_CHECK: '1'
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, retention-days: 1, include-hidden-files: true }

  # Blocks side by side keep the same line at the same height, with today's copy and with one
  # block's text made long or empty (DESIGN.md §3 Card rows): fails
  rows:
    needs: compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browsers: chromium }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Side-by-side rows (Chromium)
        run: node scripts/check-card-rows.mjs

  # Accessibility >= 95 and no color-contrast failures (fails); performance >= 90 (warning)
  lighthouse:
    needs: compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browsers: chromium }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: node scripts/lighthouse-check.mjs

  # Screenshot comparison: reported, not blocking. Baselines live in tests/visual/__screenshots__.
  visual:
    needs: compile
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to commit new screenshot baselines to the pull request branch
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browsers: chromium }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Screenshot comparison
        id: visual
        continue-on-error: true
        run: pnpm exec playwright test -c playwright.visual.config.ts
      # A missing baseline is written by the comparison above; commit it to the pull request branch.
      # Existing baselines are never overwritten: to accept a change, delete the PNG in the pull request.
      - name: Commit new screenshot baselines
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          new=$(git status --porcelain tests/visual/__screenshots__ | grep '^??' || true)
          if [ -z "$new" ]; then echo "No new baselines."; exit 0; fi
          mkdir -p /tmp/baselines && cp tests/visual/__screenshots__/*.png /tmp/baselines/
          git config user.name "Calib.Tools CI"
          git config user.email "hello@calib.tools"
          git fetch --depth=1 origin "$HEAD_REF"
          git checkout -f -B baseline-update FETCH_HEAD
          mkdir -p tests/visual/__screenshots__ && cp -n /tmp/baselines/*.png tests/visual/__screenshots__/
          git add tests/visual/__screenshots__
          git commit -m "Screenshot baselines written by CI"
          git push origin "HEAD:$HEAD_REF"
      - name: Report screenshot differences
        if: steps.visual.outcome == 'failure'
        run: echo "::warning::Screenshots differ from the baselines (or a baseline is missing). See the visual-results artifact."
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: |
            tests/visual/__screenshots__
            test-results
          if-no-files-found: ignore
          retention-days: 14

  # Same rows check in Firefox and WebKit, after a merge only: reported, not blocking, because WebKit
  # needs system libraries from the Ubuntu mirrors and their outage must not stop a merge.
  rows-engines:
    if: github.event_name == 'push'
    needs: compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { browsers: firefox webkit }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Side-by-side rows (Firefox, WebKit)
        id: rows-other
        continue-on-error: true
        run: node scripts/check-card-rows.mjs --engines firefox,webkit --widths 1280,768
      - name: Warning
        if: steps.rows-other.outcome == 'failure'
        run: echo "::warning::Side-by-side rows differ in Firefox or WebKit, or an engine did not start. See the step log."

  # Gate for scripts/ship.mjs: one check named "build" that passes only when every blocking job passed
  build:
    if: always()
    needs: [unit, compile, rows, lighthouse, visual]
    runs-on: ubuntu-24.04
    steps:
      - name: All blocking jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "unit, compile, rows, lighthouse, visual: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

name: CI
# One run per change: pull requests, and pushes to main (not both for the same commit)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to commit new screenshot baselines to the pull request branch
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install Python packages
        run: pip install Pillow opencv-python-headless numpy

      - run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      # System libraries come from the Ubuntu package mirrors, which the runners could not
      # reach for hours on 2026-11-11. The runner image already carries what Chromium needs,
      # so this step is bounded and may fail without failing the run; the tests that follow
      # start the browser and fail on their own if a library is really missing.
      - name: Install Playwright system deps (best effort)
        continue-on-error: true
        timeout-minutes: 4
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test
        env:
          BLOCKED_NAMES: ${{ secrets.BLOCKED_NAMES }}
      - run: pnpm check
      - run: pnpm build
        env:
          SKIP_STOREFRONT_CHECK: '1'
          SKIP_SPECS_CHECK: '1'

      # Cards in one row keep the same line at the same height (DESIGN.md §3 Card rows): fails
      - name: Card rows
        run: node scripts/check-card-rows.mjs

      # Accessibility >= 95 and no color-contrast failures (fails); performance >= 90 (warning)
      - name: Lighthouse
        run: node scripts/lighthouse-check.mjs

      # Screenshot comparison: reported, not blocking. Baselines live in tests/visual/__screenshots__.
      - name: Screenshot comparison
        id: visual
        continue-on-error: true
        run: pnpm exec playwright test -c playwright.visual.config.ts
      # A missing baseline is written by the comparison above; commit it to the pull request branch.
      # Existing baselines are never overwritten: to accept a change, delete the PNG in the pull request.
      - name: Commit new screenshot baselines
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          new=$(git status --porcelain tests/visual/__screenshots__ | grep '^??' || true)
          if [ -z "$new" ]; then echo "No new baselines."; exit 0; fi
          mkdir -p /tmp/baselines && cp tests/visual/__screenshots__/*.png /tmp/baselines/
          git config user.name "Calib.Tools CI"
          git config user.email "hello@calib.tools"
          git fetch --depth=1 origin "$HEAD_REF"
          git checkout -f -B baseline-update FETCH_HEAD
          mkdir -p tests/visual/__screenshots__ && cp -n /tmp/baselines/*.png tests/visual/__screenshots__/
          git add tests/visual/__screenshots__
          git commit -m "Screenshot baselines written by CI"
          git push origin "HEAD:$HEAD_REF"
      - name: Report screenshot differences
        if: steps.visual.outcome == 'failure'
        run: echo "::warning::Screenshots differ from the baselines (or a baseline is missing). See the visual-results artifact."
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: |
            tests/visual/__screenshots__
            test-results
          if-no-files-found: ignore
          retention-days: 14

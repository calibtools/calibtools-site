name: CI
# One run per change: pull requests, and pushes to main (not both for the same commit)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          pip install Pillow opencv-python-headless numpy

      - run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test
        env:
          BLOCKED_NAMES: ${{ secrets.BLOCKED_NAMES }}
      - run: pnpm check
      - run: pnpm build

      # Accessibility >= 95 and no color-contrast failures (fails); performance >= 90 (warning)
      - name: Lighthouse
        run: node scripts/lighthouse-check.mjs

      # Screenshot comparison: reported, not blocking. Baselines live in tests/visual/__screenshots__.
      - name: Screenshot comparison
        id: visual
        continue-on-error: true
        run: pnpm exec playwright test -c playwright.visual.config.ts
      - name: Report screenshot differences
        if: steps.visual.outcome == 'failure'
        run: echo "::warning::Screenshots differ from the baselines (or a baseline is missing). See the visual-results artifact."
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: |
            tests/visual/__screenshots__
            test-results
          if-no-files-found: ignore
          retention-days: 14
        env:
          SKIP_STOREFRONT_CHECK: '1'
          SKIP_SPECS_CHECK: '1'

# Send review-invite emails daily.
#
# Cron: 08:00 Europe/Berlin → 06:00 UTC (CET) or 07:00 UTC (CEST).
# We use 06:00 UTC; during summer the effective local time is 08:00 CEST
# (one hour earlier than winter). Acceptable for a daily batch job.

name: Review invites

on:
  schedule:
    # 06:00 UTC ≈ 08:00 Europe/Berlin (CET); 08:00 CEST in summer
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: review-invites
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check required secrets
        id: secrets-check
        run: |
          missing=()
          [ -z "$CF_ACCOUNT_ID" ] && missing+=("CF_ACCOUNT_ID")
          [ -z "$CF_KV_REVIEWS_NAMESPACE_ID" ] && missing+=("CF_KV_REVIEWS_NAMESPACE_ID")
          [ -z "$CF_API_TOKEN" ] && missing+=("CF_API_TOKEN")
          [ -z "$RESEND_API_KEY" ] && missing+=("RESEND_API_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Review invites skipped: secrets not configured"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_REVIEWS_NAMESPACE_ID: ${{ secrets.CF_KV_REVIEWS_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Send review invites
        if: steps.secrets-check.outputs.skip != 'true'
        run: node scripts/send-review-invites.mjs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_REVIEWS_NAMESPACE_ID: ${{ secrets.CF_KV_REVIEWS_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

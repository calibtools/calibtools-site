name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - name: Verify Storefront data in build output
        run: |
          echo "--- Checking charuco-composite for variant GIDs ---"
          if grep -q 'gid://shopify/ProductVariant/' dist/targets/charuco-composite/index.html; then
            COUNT=$(grep -o 'gid://shopify/ProductVariant/' dist/targets/charuco-composite/index.html | wc -l)
            echo "✓ Found $COUNT variant GID references"
          else
            echo "✗ FATAL: No variant GIDs in charuco-composite page — Storefront API data missing"
            echo "The build used fallback data. Check .env.production or API connectivity."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
